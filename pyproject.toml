[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iskur-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for İŞKUR (iskur.gov.tr): open job listings, job details, provinces, announcements"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
iskur-mcp = "iskur_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iskur_mcp"]
